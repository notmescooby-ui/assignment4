<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #FFF6E7;
      --dark: #8C2F39;
      --gold: #8C2F39;
      --gold-light: #a84455;
      --muted: #b06070;
      --border: rgba(140,47,57,0.25);
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(140,47,57,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -200px;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(140,47,57,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--dark);
      margin-bottom: 60px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      border: 1px solid var(--border);
      padding: 60px 56px;
      position: relative;
      background: rgba(255,246,231,0.7);
      backdrop-filter: blur(8px);
    }

    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--dark);
      border-style: solid;
    }
    .card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    .label {
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .label::before, .label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .counter-wrap {
      text-align: center;
      padding: 32px 0 40px;
    }

    .counter-number {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 7rem;
      line-height: 1;
      color: var(--dark);
      letter-spacing: -0.02em;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s;
    }

    .counter-number.pop {
      transform: scale(1.08);
      color: var(--gold-light);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--dark);
      margin: 0 auto 40px;
      opacity: 0.4;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 16px 24px;
      border: 1px solid;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: var(--dark);
      color: var(--cream);
      border-color: var(--dark);
    }
    .btn-primary:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
      color: var(--cream);
    }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-secondary:hover {
      border-color: var(--dark);
      color: var(--dark);
    }

    .btn:active { transform: scale(0.98); }

    .status-area {
      margin-top: 28px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .status.show { opacity: 1; }
    .status.ok { color: var(--dark); }
    .status.running { color: var(--muted); }

    .footer-note {
      margin-top: 56px;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(140,47,57,0.35);
    }

    .progress-bar {
      height: 1px;
      background: var(--border);
      width: 100%;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar.show { display: block; }
    .progress-fill {
      height: 100%;
      background: var(--dark);
      width: 0%;
      transition: width 2s linear;
    }
    .progress-fill.go { width: 100%; }
  </style>
</head>
<body>

  <div class="wordmark">Concurrency Counter</div>

  <div class="card">
    <div class="label">Live Value</div>

    <div class="counter-wrap">
      <div class="counter-number" id="counterDisplay">—</div>
    </div>

    <div class="divider"></div>

    <div class="actions">
      <button class="btn btn-primary" onclick="increment()">Increment</button>
      <button class="btn btn-secondary" onclick="loadTest()">Load Test &mdash; 1000 Requests</button>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status-area">
      <div class="status" id="status">Ready</div>
    </div>
  </div>

  <div class="footer-note">Atomic SQL &bull; Docker &bull; Node.js</div>

  <script>
    const API = 'http://localhost:3000';

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status show ' + type;
    }

    function setCounter(val) {
      const el = document.getElementById('counterDisplay');
      el.textContent = val.toLocaleString();
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 200);
    }

    async function fetchCounter() {
      try {
        const res = await fetch(`${API}/counter`);
        const data = await res.json();
        setCounter(data.value);
      } catch {
        document.getElementById('counterDisplay').textContent = 'err';
        setStatus('Cannot reach backend', 'running');
      }
    }

    async function increment() {
      try {
        const res = await fetch(`${API}/increment`, { method: 'POST' });
        const data = await res.json();
        setCounter(data.value);
        setStatus('Incremented', 'ok');
      } catch {
        setStatus('Request failed', '');
      }
    }

    async function loadTest() {
      const bar = document.getElementById('progressBar');
      const fill = document.getElementById('progressFill');
      bar.classList.add('show');
      fill.classList.remove('go');
      void fill.offsetWidth;
      fill.classList.add('go');

      setStatus('Firing 1000 concurrent requests…', 'running');
      const before = parseInt(document.getElementById('counterDisplay').textContent.replace(/,/g,'')) || 0;

      const requests = Array.from({ length: 1000 }, () =>
        fetch(`${API}/increment`, { method: 'POST' })
      );
      await Promise.all(requests);
      await fetchCounter();

      const after = parseInt(document.getElementById('counterDisplay').textContent.replace(/,/g,''));
      const added = after - before;
      const perfect = added === 1000;
      setStatus(perfect ? `Complete — ${added} of 1000 recorded` : `Warning — only ${added} of 1000`, perfect ? 'ok' : '');

      setTimeout(() => bar.classList.remove('show'), 1000);
    }

    fetchCounter();
  </script>
</body>
</html>
